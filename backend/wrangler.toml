name = "pixel-playground-backend"

main = "src/index.ts"

# Newest date supported by the pinned wrangler/workerd version
compatibility_date = "2026-05-28"

[observability]
enabled = true

[vars]
# Public config only — JWT_SECRET lives in .dev.vars locally and
# `wrangler secret put JWT_SECRET` in production.
ALLOWED_ORIGIN = "https://pixelplayground.shaikhaman.dev"

[[d1_databases]]
binding = "DB"
database_name = "pixel-playground-db"
# Placeholder id: local dev (`wrangler dev`, `--local` migrations) ignores it.
# For production run `wrangler d1 create pixel-playground-db` and paste the id.
database_id = "ab564003-b2f8-44f6-9e36-616afe6319b4"
migrations_dir = "migrations"

# Multiplayer (GameRoom Durable Object) was removed along with the room UI.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
deleted_classes = ["GameRoom"]
